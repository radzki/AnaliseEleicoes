<!doctype html>
<html lang="{{404.lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>{{404.title}}</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/theme.css">
<style>
  main { max-width: 40rem; margin: 18vh auto 0; padding: 0 16px; }
  h1 { font-size: var(--cds-font-size-title); line-height: 1.2; margin: 0 0 var(--cds-gap-md); }
  p { color: var(--color-fg-muted); margin: 0 0 var(--cds-gap-lg); }
  a { font-weight: var(--cds-font-weight-medium); text-underline-offset: 3px; }
  a:focus-visible { outline: 3px solid var(--color-fg); outline-offset: 2px; border-radius: 3px; }
</style>
<script>
  try { const t = { claro: 'light', escuro: 'dark' }[localStorage.getItem('tema')]; if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<main>
  <h1>{{404.h1}}</h1>
  <p>{{404.p}}</p>
  <a href="/">{{404.link}}</a>
</main>
</body>
</html>
